<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя статистика</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 { color: #333; }
        .subtitle { color: #666; margin-bottom: 30px; }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-value {
            font-size: 36px;
            font-weight: bold;
            margin: 10px 0;
        }
        .stat-value.green { color: #48bb78; }
        .stat-value.red { color: #fc8181; }
        .stat-value.blue { color: #667eea; }
        .stat-label {
            color: #666;
            font-size: 14px;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #48bb78 0%, #38a169 100%);
            transition: width 0.5s ease;
        }
        .topic-stat {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .topic-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #cbd5e0;
        }
        .btn-danger {
            background: #fc8181;
            color: white;
        }
        .btn-danger:hover {
            background: #f56565;
        }
        .no-data {
            text-align: center;
            color: #666;
            padding: 40px;
        }
        .user-id {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
            word-break: break-all;
            margin: 10px 0;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        .copy-btn {
            margin-left: 10px;
            padding: 5px 10px;
            border: none;
            background: #e2e8f0;
            border-radius: 4px;
            cursor: pointer;
        }
        .copy-btn:hover {
            background: #cbd5e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>📊 Моя статистика</h1>
                <p class="subtitle">Результаты прохождения тестов</p>
            </div>
            <a href="/" class="btn btn-primary" style="padding: 8px 16px; font-size: 14px;">← На главную</a>
        </div>

        <div id="userIdDisplay" class="user-id"></div>

        <div id="statsContent">
            <div class="no-data">Загрузка...</div>
        </div>

        <div class="actions">
            <button class="btn btn-secondary" onclick="location.reload()">🔄 Обновить</button>
            <button class="btn btn-danger" onclick="resetAll()">🗑️ Сбросить всё</button>
        </div>
    </div>

    <script>
        const API_URL = '/api/v1';

        function getUserId() {
            const saved = localStorage.getItem('quiz_progress');
            if (saved) {
                try {
                    const progress = JSON.parse(saved);
                    return progress.userId;
                } catch (e) {}
            }
            return null;
        }

        async function loadStatistics() {
            const userId = getUserId();

            if (!userId) {
                document.getElementById('statsContent').innerHTML = `
                    <div class="no-data">
                        <p>😕 У вас пока нет статистики</p>
                        <p style="font-size: 14px; margin-top: 10px;">
                            Пройдите тесты на <a href="/">главной странице</a>
                        </p>
                    </div>
                `;
                document.getElementById('userIdDisplay').style.display = 'none';
                return;
            }

            document.getElementById('userIdDisplay').innerHTML = `
                <strong>Ваш ID:</strong> ${userId}
                <button class="copy-btn" onclick="navigator.clipboard.writeText('${userId}')">📋 Копировать</button>
            `;
            document.getElementById('userIdDisplay').style.display = 'block';

            try {
                const response = await fetch(`${API_URL}/statistics/${userId}`);
                if (!response.ok) throw new Error('Failed to load statistics');
                const stats = await response.json();
                displayStatistics(stats);
            } catch (error) {
                console.error('Error loading statistics:', error);
                document.getElementById('statsContent').innerHTML = `
                    <div class="no-data" style="color: #fc8181;">
                        ❌ Ошибка загрузки статистики
                    </div>
                `;
            }
        }

        function displayStatistics(stats) {
            const total = stats.total_answered || 0;
            const correct = stats.correct_count || 0;
            const wrong = stats.wrong_count || 0;
            const rate = stats.success_rate || 0;

            let html = `
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-label">Всего ответов</div>
                        <div class="stat-value blue">${total}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Правильно</div>
                        <div class="stat-value green">${correct}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Неправильно</div>
                        <div class="stat-value red">${wrong}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Успеваемость</div>
                        <div class="stat-value ${rate >= 70 ? 'green' : rate >= 50 ? 'blue' : 'red'}">${rate.toFixed(1)}%</div>
                    </div>
                </div>

                <div style="margin: 20px 0;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                        <span>Общий прогресс</span>
                        <span>${rate.toFixed(1)}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${rate}%;"></div>
                    </div>
                </div>
            `;

            if (stats.topics && stats.topics.length > 0) {
                html += `<h3 style="margin: 20px 0 10px;">📚 По темам:</h3>`;
                stats.topics.forEach(t => {
                    const percent = t.percentage || 0;
                    html += `
                        <div class="topic-stat">
                            <div class="topic-header">
                                <strong>${t.topic_name}</strong>
                                <span>${t.correct_answers}/${t.total_questions}</span>
                            </div>
                            <div class="progress-bar" style="height: 8px;">
                                <div class="progress-fill" style="width: ${percent}%; background: ${percent >= 70 ? '#48bb78' : percent >= 50 ? '#667eea' : '#fc8181'};"></div>
                            </div>
                            <div style="font-size: 12px; color: #666; margin-top: 5px;">
                                ${percent.toFixed(0)}% • ${t.correct_answers} правильных
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById('statsContent').innerHTML = html;
        }

        function resetAll() {
            if (confirm('Сбросить всю статистику и прогресс?')) {
                localStorage.removeItem('quiz_progress');
                location.reload();
            }
        }

        loadStatistics();
    </script>
</body>
</html>
